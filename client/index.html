<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stardew Combat</title>
    <style>
      body { margin: 0; padding: 0; overflow: hidden; background-color: #222; }
      canvas { display: block; }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        pointer-events: none;
        color: white;
        font-family: 'Courier New', Courier, monospace;
        padding: 10px;
        box-sizing: border-box;
        text-shadow: 1px 1px 2px black;
        display: none; /* Hidden until joined */
        z-index: 10;
      }
      #timer { font-size: 24px; font-weight: bold; text-align: center; }
      #scoreboard { 
        position: absolute; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%, -50%);
        font-size: 20px; 
        text-align: left;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        display: none; /* Hidden by default */
        z-index: 11;
        pointer-events: none;
      }
      #dark-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: none; /* Hidden by default */
        z-index: 9;
        pointer-events: none;
      }
      #home-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #222;
        color: white;
        font-family: 'Courier New', Courier, monospace;
        z-index: 20;
      }
      .form-group {
        margin-bottom: 15px;
        text-align: left;
        width: 250px;
      }
      .form-group label { display: block; margin-bottom: 5px; }
      .form-group input, .form-group select {
        width: 100%; padding: 8px; box-sizing: border-box;
        font-family: 'Courier New', Courier, monospace;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        font-family: 'Courier New', Courier, monospace;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
      }
      button:hover { background-color: #45a049; }
      #app { display: none; } /* Hidden until joined */
      #death-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgba(150, 0, 0, 0.7);
        color: white;
        font-size: 48px;
        font-weight: bold;
        font-family: 'Courier New', Courier, monospace;
        z-index: 15;
        pointer-events: none;
      }
      #kill-logger {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 24px;
        font-weight: bold;
        font-family: 'Courier New', Courier, monospace;
        text-shadow: 2px 2px 4px black;
        pointer-events: none;
        z-index: 12;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
      #drop-logger {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        color: #55ff55;
        font-size: 20px;
        font-weight: bold;
        font-family: 'Courier New', Courier, monospace;
        text-shadow: 2px 2px 4px black;
        pointer-events: none;
        z-index: 12;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div id="home-screen">
      <h1>Stardew Combat</h1>
      <div class="form-group">
        <label>In-game Name:</label>
        <input type="text" id="player-name" placeholder="Enter your name" value="Player" />
      </div>
      <div class="form-group">
        <label>Room Number:</label>
        <input type="text" id="room-number" placeholder="Room Name" value="game_room" />
      </div>
      <div class="form-group">
        <label>Select Sprite:</label>
        <select id="player-sprite">
          <option value="priest1">Priest 1</option>
          <option value="priest2">Priest 2</option>
          <option value="priest3">Priest 3</option>
          <option value="skeleton1">Skeleton 1</option>
          <option value="skeleton2">Skeleton 2</option>
          <option value="skull">Skull</option>
          <option value="vampire">Vampire</option>
        </select>
      </div>
      <button id="join-btn">Join Game</button>
    </div>

    <div id="dark-overlay"></div>
    <div id="death-screen">You Died... Respawning</div>
    <div id="kill-logger"></div>
    <div id="drop-logger"></div>
    <div id="ui-layer">
      <div id="timer">Waiting for players...</div>
      <div id="scoreboard"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
