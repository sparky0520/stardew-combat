<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stardew Combat</title>
    <style>
      body { 
        margin: 0; padding: 0; overflow: hidden; background-color: #222; font-family: 'Courier New', Courier, monospace; 
      }
      canvas { display: block; image-rendering: pixelated; }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: none; /* Hidden until joined */
        z-index: 10;
      }
      #hud-box {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        border: 10px solid transparent;
        border-image: url('assets/dungeon/2D Pixel Dungeon Asset Pack/interface/square_up_down_2.png') 16 stretch;
        image-rendering: pixelated;
        padding: 15px;
        color: white;
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        font-weight: bold;
        text-shadow: 1px 1px 2px black;
        text-align: right;
      }
      #time-box {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        border: 10px solid transparent;
        border-image: url('assets/dungeon/2D Pixel Dungeon Asset Pack/interface/square_up_down_2.png') 16 stretch;
        image-rendering: pixelated;
        padding: 15px;
        color: white;
        font-family: 'Courier New', Courier, monospace;
        font-size: 18px;
        font-weight: bold;
        text-shadow: 1px 1px 2px black;
        text-align: left;
      }
      #game-message { 
        position: absolute;
        top: 80px;
        width: 100%;
        text-align: center;
        font-size: 32px; 
        font-weight: bold; 
        color: white;
        text-shadow: 2px 2px 4px black;
      }
      #scoreboard { 
        position: absolute; 
        top: 50%; 
        left: 50%; 
        transform: translate(-50%, -50%);
        font-size: 20px; 
        text-align: left;
        background: rgba(0, 0, 0, 0.8);
        border: 10px solid transparent;
        border-image: url('assets/dungeon/2D Pixel Dungeon Asset Pack/interface/square_up_down_2.png') 16 stretch;
        image-rendering: pixelated;
        padding: 20px;
        border-radius: 0px;
        color: white;
        display: none; /* Hidden by default */
        z-index: 11;
        pointer-events: none;
      }
      #dark-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: none; /* Hidden by default */
        z-index: 9;
        pointer-events: none;
      }
      #home-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #1a1a2e;
        color: white;
        z-index: 20;
      }
      .home-panel {
        background: rgba(20, 20, 30, 0.9);
        border: 12px solid transparent;
        border-image: url('assets/dungeon/2D Pixel Dungeon Asset Pack/interface/square_up_down_3.png') 16 stretch;
        image-rendering: pixelated;
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .home-panel h1 {
        margin-top: 0;
        font-size: 32px;
        text-shadow: 2px 2px 0 #000;
        color: #f1c40f;
      }
      .form-group {
        margin-bottom: 20px;
        text-align: left;
        width: 250px;
      }
      .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
      .form-group input, .form-group select {
        width: 100%; padding: 10px; box-sizing: border-box;
        font-family: inherit;
        background: #333;
        color: white;
        border: 2px solid #555;
      }
      .form-group input:focus, .form-group select:focus {
        border-color: #f1c40f;
        outline: none;
      }
      button {
        margin-top: 10px;
        padding: 12px 24px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        font-family: inherit;
        background-color: #e74c3c;
        color: white;
        border: 4px solid #c0392b;
        image-rendering: pixelated;
      }
      button:hover { 
        background-color: #c0392b; 
        border-color: #e74c3c;
      }
      .sprite-selector {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin: 10px 0;
      }
      .nav-btn {
        background-color: #555;
        border: 2px solid #777;
        padding: 5px 15px;
        font-size: 24px;
        margin: 0;
      }
      .nav-btn:hover {
        background-color: #777;
        border-color: #f1c40f;
      }
      #sprite-preview {
        width: 128px;
        height: 128px;
        image-rendering: pixelated;
        overflow: hidden;
        position: relative;
      }
      #sprite-preview img {
        height: 100%;
        image-rendering: pixelated;
        display: block;
      }
      #app { display: none; } /* Hidden until joined */
      #death-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgba(150, 0, 0, 0.7);
        color: white;
        font-size: 48px;
        font-weight: bold;
        font-family: 'Courier New', Courier, monospace;
        z-index: 15;
        pointer-events: none;
      }
      #kill-logger {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 24px;
        font-weight: bold;
        font-family: 'Courier New', Courier, monospace;
        text-shadow: 2px 2px 4px black;
        pointer-events: none;
        z-index: 12;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
      #drop-logger {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        color: #55ff55;
        font-size: 20px;
        font-weight: bold;
        font-family: 'Courier New', Courier, monospace;
        text-shadow: 2px 2px 4px black;
        pointer-events: none;
        z-index: 12;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div id="home-screen">
      <div class="home-panel">
        <h1>Stardew Combat</h1>
        <div class="form-group">
          <label>In-game Name:</label>
          <input type="text" id="player-name" placeholder="Enter your name" value="Player" />
        </div>
        <div class="form-group">
          <label>Room Number:</label>
          <input type="text" id="room-number" placeholder="Room Name" value="game_room" />
        </div>
        <div class="form-group" style="text-align: center;">
          <label>Select Sprite:</label>
          <div class="sprite-selector">
            <button type="button" id="prev-sprite" class="nav-btn">&lt;</button>
            <div id="sprite-preview"></div>
            <button type="button" id="next-sprite" class="nav-btn">&gt;</button>
          </div>
          <input type="hidden" id="player-sprite" value="priest1" />
          <div id="sprite-name" style="margin-top: 10px; font-weight: bold; color: #f1c40f; font-size: 20px;">Priest 1</div>
        </div>
        <button id="join-btn">Join Game</button>
      </div>
    </div>

    <div id="dark-overlay"></div>
    <div id="death-screen">You Died... Respawning</div>
    <div id="kill-logger"></div>
    <div id="drop-logger"></div>
    <div id="scoreboard"></div>
    <div id="ui-layer">
      <div id="game-message"></div>
      <div id="time-box">Waiting for players...</div>
      <div id="hud-box"></div>
    </div>
    <div id="app"></div>
    
    <script>
      const sprites = [
        { id: 'priest1', name: 'Priest 1', type: 'frames', folder: 'priests_idle', frames: 4 },
        { id: 'priest2', name: 'Priest 2', type: 'frames', folder: 'priests_idle', frames: 4 },
        { id: 'priest3', name: 'Priest 3', type: 'frames', folder: 'priests_idle', frames: 4 },
        { id: 'skeleton1', name: 'Skeleton 1', type: 'spritesheet', src: 'assets/enemies/Enemy_Animations_Set/enemies-skeleton1_idle.png', frames: 6 },
        { id: 'skeleton2', name: 'Skeleton 2', type: 'spritesheet', src: 'assets/enemies/Enemy_Animations_Set/enemies-skeleton2_idle.png', frames: 6 },
        { id: 'skull', name: 'Skull', type: 'frames', folder: 'monsters_idle', frames: 4 },
        { id: 'vampire', name: 'Vampire', type: 'spritesheet', src: 'assets/enemies/Enemy_Animations_Set/enemies-vampire_idle.png', frames: 6 }
      ];
      
      let currentSpriteIndex = 0;
      let currentFrame = 1;
      let animInterval;
      
      const previewDiv = document.getElementById('sprite-preview');
      const nameDiv = document.getElementById('sprite-name');
      const inputEl = document.getElementById('player-sprite');
      
      function updatePreview() {
        clearInterval(animInterval);
        const sprite = sprites[currentSpriteIndex];
        nameDiv.innerText = sprite.name;
        inputEl.value = sprite.id;
        
        if (sprite.type === 'frames') {
          currentFrame = 1;
          previewDiv.innerHTML = `<img id="preview-img" style="width: 128px;" src="assets/dungeon/2D Pixel Dungeon Asset Pack/Character_animation/${sprite.folder}/${sprite.id}/v1/${sprite.id}_v1_1.png" />`;
          
          animInterval = setInterval(() => {
            currentFrame = (currentFrame % sprite.frames) + 1;
            document.getElementById('preview-img').src = `assets/dungeon/2D Pixel Dungeon Asset Pack/Character_animation/${sprite.folder}/${sprite.id}/v1/${sprite.id}_v1_${currentFrame}.png`;
          }, 150);
        } else {
          previewDiv.innerHTML = `<img id="preview-img" style="width: ${sprite.frames * 128}px; position: absolute; left: 0; top: 0; transition: none;" src="${sprite.src}" />`;
          
          let frame = 0;
          animInterval = setInterval(() => {
            frame = (frame + 1) % sprite.frames;
            document.getElementById('preview-img').style.transform = `translateX(-${frame * 128}px)`;
          }, 150);
        }
      }
      
      document.getElementById('prev-sprite').addEventListener('click', () => {
        currentSpriteIndex = (currentSpriteIndex - 1 + sprites.length) % sprites.length;
        updatePreview();
      });
      
      document.getElementById('next-sprite').addEventListener('click', () => {
        currentSpriteIndex = (currentSpriteIndex + 1) % sprites.length;
        updatePreview();
      });
      
      updatePreview();
      
      // Setup Custom Cursor (Scale and Rotate)
      const cursorImg = new Image();
      cursorImg.src = 'assets/dungeon/2D Pixel Dungeon Asset Pack/interface/arrow_1.png';
      cursorImg.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 48;
        canvas.height = 48;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false; // keep it pixelated
        
        ctx.translate(24, 24);
        // Assuming arrow_1 points down, rotate 135 degrees to point top-left
        ctx.rotate((135 * Math.PI) / 180);
        // Draw image scaled up to 48x48
        ctx.drawImage(cursorImg, -24, -24, 48, 48); 
        
        const dataURL = canvas.toDataURL();
        const cursorStyle = document.createElement('style');
        cursorStyle.innerHTML = `* { cursor: url('${dataURL}') 6 6, auto !important; }`;
        document.head.appendChild(cursorStyle);
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
