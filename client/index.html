<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stardew Combat</title>
    <style>
      body { margin: 0; padding: 0; overflow: hidden; background-color: #222; }
      canvas { display: block; }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        pointer-events: none;
        color: white;
        font-family: 'Courier New', Courier, monospace;
        padding: 10px;
        box-sizing: border-box;
        text-shadow: 1px 1px 2px black;
      }
      #timer { font-size: 24px; font-weight: bold; text-align: center; }
      #scoreboard { position: absolute; top: 10px; right: 10px; font-size: 16px; text-align: right;}
    </style>
  </head>
  <body>
    <div id="ui-layer">
      <div id="timer">Waiting for players...</div>
      <div id="scoreboard"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
